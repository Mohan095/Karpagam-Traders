<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8B0000" />
  <title>Offline | Karpagam Traders Sivakasi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #fdf8f5 0%, #faede8 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 45px rgba(139, 0, 0, 0.12);
      border: 1px solid rgba(139, 0, 0, 0.1);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8B0000 0%, #5a0000 100%);
      color: #D4AF37;
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(139, 0, 0, 0.3);
      border: 2px solid #D4AF37;
    }
    h1 {
      color: #8B0000;
      font-size: 1.55rem;
      font-weight: 800;
      margin-bottom: 10px;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-retry {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #8B0000 0%, #b22222 100%);
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(139, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .offline-call-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed #e2e8f0;
      text-align: left;
    }
    .offline-call-box span {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8B0000;
      margin-bottom: 6px;
    }
    .offline-call-box a {
      color: #1e293b;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: block;
      margin-bottom: 4px;
    }
    .offline-call-box a:hover {
      color: #8B0000;
    }
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fef2f2;
      color: #dc2626;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dc2626;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="logo-badge" style="overflow: hidden; padding: 2px;">
      <img src="/logo.png" alt="Karpagam Traders Goddess Emblem" style="width: 100%; height: 100%; object-fit: contain; border-radius: 50%;" onerror="this.parentElement.innerHTML='KT'" />
    </div>
    
    <div class="status-indicator">
      <span class="status-dot"></span>
      No Internet Connection
    </div>

    <h1>You Are Offline</h1>
    <p>
      It seems you lost your connection. Karpagam Traders PWA is ready to reconnect automatically as soon as your internet returns.
    </p>

    <button class="btn-retry" onclick="window.location.reload()">
      Retry Connection
    </button>

    <div class="offline-call-box">
      <span>Call us directly for urgent orders:</span>
      <a href="tel:+919566801402">📞 +91 9566801402</a>
      <a href="tel:+919489691402">📞 +91 9489691402</a>
    </div>
  </div>
</body>
</html>
